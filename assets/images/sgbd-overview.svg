<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 515" width="820" height="515" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Visión general de un SGBD</title><desc id="d">Usuarios y aplicaciones envían consultas SQL al SGBD, que gestiona el almacenamiento físico.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs>
<style>.hot{cursor:pointer;transition:filter .15s}.hot:hover,.hot:focus,.hot.on{filter:brightness(1.35) drop-shadow(0 0 6px rgba(255,255,255,.35));outline:none}</style>
<rect width="820" height="515" rx="12" fill="url(#bg)"/>
<text x="410.0" y="40.0" font-size="21" fill="#f1f5f9" text-anchor="middle" font-weight="700">Visión general de un SGBD</text>
<rect x="24.0" y="70.0" width="220.0" height="380.0" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="134.0" y="98.0" font-size="16" fill="#38bdf8" text-anchor="middle" font-weight="700">Usuarios y apps</text>
<g class="hot" tabindex="0" data-tip="Aplicaciones que se conectan al SGBD mediante un driver (JDBC, ODBC…).">
<rect x="42.0" y="118.0" width="184.0" height="56.0" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
<text x="134.0" y="150.9" font-size="14" fill="#f1f5f9" text-anchor="middle">Apps web / móvil</text>
</g>
<g class="hot" tabindex="0" data-tip="Consultan datos a través de formularios o informes; no escriben SQL.">
<rect x="42.0" y="196.0" width="184.0" height="56.0" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
<text x="134.0" y="228.9" font-size="14" fill="#f1f5f9" text-anchor="middle">Usuarios finales</text>
</g>
<g class="hot" tabindex="0" data-tip="Crea usuarios, ajusta el rendimiento, hace copias de seguridad.">
<rect x="42.0" y="274.0" width="184.0" height="56.0" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
<text x="134.0" y="306.9" font-size="14" fill="#f1f5f9" text-anchor="middle">Administrador (DBA)</text>
</g>
<g class="hot" tabindex="0" data-tip="Escriben consultas y procedimientos almacenados.">
<rect x="42.0" y="352.0" width="184.0" height="56.0" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
<text x="134.0" y="384.9" font-size="14" fill="#f1f5f9" text-anchor="middle">Programadores SQL</text>
</g>
<rect x="300.0" y="70.0" width="230.0" height="380.0" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
<text x="415.0" y="98.0" font-size="16" fill="#60a5fa" text-anchor="middle" font-weight="700">SGBD (DBMS)</text>
<g class="hot" tabindex="0" data-tip="Analiza (parser) y valida cada sentencia SQL.">
<rect x="318.0" y="118.0" width="194.0" height="56.0" rx="8" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
<text x="415.0" y="142.2" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">Procesador de</text>
<text x="415.0" y="159.7" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">consultas</text>
</g>
<g class="hot" tabindex="0" data-tip="Elige el plan de ejecución más barato: qué índice usar, en qué orden hacer los joins.">
<rect x="318.0" y="196.0" width="194.0" height="56.0" rx="8" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
<text x="415.0" y="228.9" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">Optimizador de SQL</text>
</g>
<g class="hot" tabindex="0" data-tip="Garantiza ACID: COMMIT, ROLLBACK, bloqueos y recuperación.">
<rect x="318.0" y="274.0" width="194.0" height="56.0" rx="8" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
<text x="415.0" y="306.9" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">Gestor de transacciones</text>
</g>
<g class="hot" tabindex="0" data-tip="Comprueba privilegios y restricciones (PK, FK, CHECK).">
<rect x="318.0" y="352.0" width="194.0" height="56.0" rx="8" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
<text x="415.0" y="384.9" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">Seguridad e integridad</text>
</g>
<rect x="586.0" y="70.0" width="210.0" height="380.0" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
<text x="691.0" y="98.0" font-size="16" fill="#34d399" text-anchor="middle" font-weight="700">Almacenamiento</text>
<g class="hot" tabindex="0" data-tip="Ficheros de datos en disco, organizados en bloques/páginas.">
<rect x="604.0" y="118.0" width="174.0" height="56.0" rx="8" fill="#047857" stroke="#34d399" stroke-width="2"/>
<text x="691.0" y="150.9" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">Datos físicos</text>
</g>
<g class="hot" tabindex="0" data-tip="Metadatos: qué tablas, columnas y usuarios existen. Se consulta con vistas como USER_TABLES (Oracle).">
<rect x="604.0" y="196.0" width="174.0" height="56.0" rx="8" fill="#047857" stroke="#34d399" stroke-width="2"/>
<text x="691.0" y="228.9" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">Diccionario de datos</text>
</g>
<g class="hot" tabindex="0" data-tip="Estructuras (B-tree) que aceleran búsquedas.">
<rect x="604.0" y="274.0" width="174.0" height="56.0" rx="8" fill="#047857" stroke="#34d399" stroke-width="2"/>
<text x="691.0" y="306.9" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">Índices</text>
</g>
<g class="hot" tabindex="0" data-tip="Registro de cambios para deshacer y rehacer transacciones.">
<rect x="604.0" y="352.0" width="174.0" height="56.0" rx="8" fill="#047857" stroke="#34d399" stroke-width="2"/>
<text x="691.0" y="384.9" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">Logs (redo/undo)</text>
</g>
<line x1="244.0" y1="216.0" x2="298.0" y2="216.0" stroke="#38bdf8" stroke-width="2.5"/>
<polygon points="298.0,216.0 288.8,219.9 288.8,212.1" fill="#38bdf8"/>
<line x1="532.0" y1="216.0" x2="584.0" y2="216.0" stroke="#34d399" stroke-width="2.5"/>
<polygon points="584.0,216.0 574.8,219.9 574.8,212.1" fill="#34d399"/>
<line x1="244.0" y1="294.0" x2="298.0" y2="294.0" stroke="#38bdf8" stroke-width="2.5"/>
<polygon points="298.0,294.0 288.8,297.9 288.8,290.1" fill="#38bdf8"/>
<line x1="532.0" y1="294.0" x2="584.0" y2="294.0" stroke="#34d399" stroke-width="2.5"/>
<polygon points="584.0,294.0 574.8,297.9 574.8,290.1" fill="#34d399"/>
<text x="410.0" y="480.0" font-size="14" fill="#94a3b8" text-anchor="middle">El SGBD es la capa intermedia entre las aplicaciones y el almacenamiento físico.</text>
<text x="410.0" y="502.0" font-size="12" fill="#94a3b8" text-anchor="middle" font-style="italic">Pasa el ratón sobre cada bloque para ver qué hace.</text>
</svg>