<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Métodos de organización y acceso a ficheros</title><desc id="d">Acceso secuencial, directo con fórmula de desplazamiento e indexado.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs>
<style>.hot{cursor:pointer;transition:filter .15s}.hot:hover,.hot:focus,.hot.on{filter:brightness(1.35) drop-shadow(0 0 6px rgba(255,255,255,.35));outline:none}</style>
<rect width="880" height="560" rx="12" fill="url(#bg)"/>
<text x="440.0" y="40.0" font-size="21" fill="#f1f5f9" text-anchor="middle" font-weight="700">Métodos de organización y acceso a ficheros</text>
<rect x="24.0" y="66.0" width="832.0" height="130.0" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="44.0" y="94.0" font-size="16" fill="#38bdf8" text-anchor="start" font-weight="700">1. Acceso secuencial (cintas magnéticas)</text>
<text x="44.0" y="116.0" font-size="13" fill="#94a3b8" text-anchor="start">Para leer el registro 4 hay que recorrer antes el 1, el 2 y el 3.</text>
<g class="hot" tabindex="0" data-tip="Leído y descartado: no es el que buscamos.">
<rect x="44.0" y="134.0" width="118.0" height="44.0" rx="6" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
<text x="103.0" y="160.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Registro 1</text>
</g>
<g class="hot" tabindex="0" data-tip="Leído y descartado: no es el que buscamos.">
<rect x="174.0" y="134.0" width="118.0" height="44.0" rx="6" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
<text x="233.0" y="160.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Registro 2</text>
</g>
<g class="hot" tabindex="0" data-tip="Leído y descartado: no es el que buscamos.">
<rect x="304.0" y="134.0" width="118.0" height="44.0" rx="6" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
<text x="363.0" y="160.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Registro 3</text>
</g>
<g class="hot" tabindex="0" data-tip="Solo se llega a él tras leer todos los anteriores: coste O(n).">
<rect x="434.0" y="134.0" width="150.0" height="44.0" rx="6" fill="#047857" stroke="#34d399" stroke-width="2"/>
<text x="509.0" y="152.4" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Registro 4</text>
<text x="509.0" y="168.7" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">(buscado)</text>
</g>
<line x1="100.0" y1="188.0" x2="560.0" y2="188.0" stroke="#f87171" stroke-width="2"/>
<polygon points="560.0,188.0 550.8,191.9 550.8,184.1" fill="#f87171"/>
<text x="600.0" y="192.0" font-size="12" fill="#f87171" text-anchor="start" font-style="italic">recorrido paso a paso (lento)</text>
<rect x="24.0" y="212.0" width="832.0" height="150.0" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
<text x="44.0" y="240.0" font-size="16" fill="#34d399" text-anchor="start" font-weight="700">2. Acceso directo (discos; registros de longitud fija L)</text>
<text x="44.0" y="262.0" font-size="13" fill="#94a3b8" text-anchor="start">Desplazamiento = N × L: se salta directamente a la posición.</text>
<g class="hot" tabindex="0" data-tip="Con L = 230 bytes, el registro 0 ocupa los bytes 0 a 229.">
<rect x="44.0" y="282.0" width="190.0" height="50.0" rx="6" fill="#334155" stroke="#64748b" stroke-width="2"/>
<text x="139.0" y="311.6" font-size="13" fill="#f1f5f9" text-anchor="middle">Reg 0 · bytes 0–229</text>
</g>
<g class="hot" tabindex="0" data-tip="El registro 1 empieza en 1 × 230 = 230.">
<rect x="246.0" y="282.0" width="210.0" height="50.0" rx="6" fill="#334155" stroke="#64748b" stroke-width="2"/>
<text x="351.0" y="311.6" font-size="13" fill="#f1f5f9" text-anchor="middle">Reg 1 · bytes 230–459</text>
</g>
<g class="hot" tabindex="0" data-tip="Fórmula del desplazamiento: N × L.">
<rect x="468.0" y="282.0" width="190.0" height="50.0" rx="6" fill="#047857" stroke="#34d399" stroke-width="2"/>
<text x="563.0" y="311.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Reg N · offset N × 230</text>
</g>
<text x="676.0" y="302.0" font-size="13" fill="#fbbf24" text-anchor="start" font-weight="700">Ejemplo: el registro 10</text>
<text x="676.0" y="319.0" font-size="13" fill="#fbbf24" text-anchor="start" font-weight="700">está en el byte 2300.</text>
<rect x="24.0" y="378.0" width="832.0" height="160.0" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
<text x="44.0" y="406.0" font-size="16" fill="#a78bfa" text-anchor="start" font-weight="700">3. Acceso indexado (índices, árboles B)</text>
<text x="44.0" y="428.0" font-size="13" fill="#94a3b8" text-anchor="start">Un índice guarda pares (clave → puntero) y permite buscar rápido en ficheros de longitud variable.</text>
<g class="hot" tabindex="0" data-tip="El índice se recorre rápido (está ordenado) y devuelve la posición del bloque.">
<rect x="44.0" y="452.0" width="230.0" height="56.0" rx="6" fill="#6d28d9" stroke="#a78bfa" stroke-width="2"/>
<text x="159.0" y="484.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Índice: ID 25 → puntero #402</text>
</g>
<line x1="276.0" y1="480.0" x2="410.0" y2="480.0" stroke="#fbbf24" stroke-width="2.5"/>
<polygon points="410.0,480.0 400.8,483.9 400.8,476.1" fill="#fbbf24"/>
<g class="hot" tabindex="0" data-tip="Un único acceso al bloque devuelve el registro.">
<rect x="414.0" y="452.0" width="280.0" height="56.0" rx="6" fill="#334155" stroke="#64748b" stroke-width="2"/>
<text x="554.0" y="484.6" font-size="13" fill="#f1f5f9" text-anchor="middle" font-weight="700">Bloque de datos #402 en disco</text>
</g>
</svg>